<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Contribution List</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --primary: #7656e8;
    --primary-light: #9b82ff;
    --text: #181624;
    --muted: #77738a;
    --danger: #e74d67;
    --glass: rgba(255,255,255,.60);
    --glass-border: rgba(255,255,255,.78);
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", Arial, sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at 5% 5%,
            rgba(171,140,255,.65),
            transparent 30%
        ),
        radial-gradient(
            circle at 95% 10%,
            rgba(99,220,255,.50),
            transparent 30%
        ),
        radial-gradient(
            circle at 70% 95%,
            rgba(255,172,218,.45),
            transparent 35%
        ),
        #eef0f8;

    overflow-x: hidden;
}

/* =========================
   LIQUID BACKGROUND
========================= */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .45;
    z-index: -1;
    pointer-events: none;
    animation: liquidMove 9s ease-in-out infinite alternate;
}

body::before {
    background: #8566ff;
    left: -130px;
    top: 15%;
}

body::after {
    background: #4de2ee;
    right: -130px;
    bottom: 5%;
    animation-delay: 2s;
}

@keyframes liquidMove {

    0% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(35px,-25px) scale(1.15);
    }

    100% {
        transform: translate(-20px,30px) scale(.95);
    }
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    max-width: 720px;
    margin: auto;
    padding: 14px 12px 40px;
}

/* =========================
   GLASS
========================= */

.glass {
    background: var(--glass);

    border: 1px solid var(--glass-border);

    box-shadow:
        0 20px 50px rgba(65,45,120,.12),
        inset 0 1px 0 rgba(255,255,255,.85);

    backdrop-filter: blur(25px) saturate(160%);
    -webkit-backdrop-filter: blur(25px) saturate(160%);
}

/* =========================
   HEADER
========================= */

.header {
    position: relative;
    overflow: hidden;

    padding: 23px;

    border-radius: 30px;

    margin-bottom: 13px;
}

.header::after {
    content: "";

    position: absolute;

    width: 160px;
    height: 160px;

    border-radius: 50%;

    right: -55px;
    top: -70px;

    background: rgba(255,255,255,.22);

    filter: blur(3px);
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 7px 11px;

    border-radius: 100px;

    background: rgba(255,255,255,.55);

    color: var(--primary);

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 1px;
}

.header h1 {
    margin: 13px 0 6px;

    font-size: clamp(28px, 8vw, 40px);

    line-height: 1.05;

    letter-spacing: -1.6px;
}

.header p {
    margin: 0;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.5;
}

/* =========================
   FORM
========================= */

.form {
    padding: 15px;

    border-radius: 27px;

    margin-bottom: 13px;
}

.field {
    margin-bottom: 10px;
}

.field input {
    width: 100%;
    height: 53px;

    padding: 0 15px;

    border: 1px solid rgba(255,255,255,.85);

    border-radius: 17px;

    outline: none;

    background: rgba(255,255,255,.55);

    color: var(--text);

    font-family: inherit;
    font-size: 14px;

    transition: .2s ease;
}

.field input::placeholder {
    color: #9995a7;
}

.field input:focus {
    background: rgba(255,255,255,.85);

    border-color: rgba(118,86,232,.45);

    box-shadow:
        0 0 0 4px rgba(118,86,232,.08);
}

/* =========================
   BUTTON
========================= */

.add-btn {
    width: 100%;
    height: 53px;

    border: 0;

    border-radius: 17px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #7656e8,
            #9b7cff
        );

    font-family: inherit;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 12px 28px rgba(118,86,232,.25);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.add-btn:active {
    transform: scale(.97);

    box-shadow:
        0 6px 15px rgba(118,86,232,.2);
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 13px;
}

.stat {
    padding: 16px;

    border-radius: 23px;
}

.stat-label {
    color: var(--muted);

    font-size: 10px;

    font-weight: 600;

    letter-spacing: .5px;

    margin-bottom: 6px;
}

.stat-value {
    font-size: 21px;

    font-weight: 800;

    letter-spacing: -.6px;
}

/* =========================
   LIST
========================= */

.list-card {
    overflow: hidden;

    border-radius: 28px;

    margin-bottom: 13px;
}

.list-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 18px;
}

.list-header strong {
    font-size: 16px;
}

.count {
    padding: 6px 10px;

    border-radius: 50px;

    color: var(--primary);

    background: rgba(118,86,232,.10);

    font-size: 10px;

    font-weight: 800;
}

.empty {
    padding: 42px 20px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

/* =========================
   ENTRY
========================= */

.entry {
    display: grid;

    grid-template-columns:
        34px
        minmax(0,1fr)
        auto
        34px;

    gap: 9px;

    align-items: center;

    padding: 13px 15px;

    border-top:
        1px solid
        rgba(80,70,100,.08);

    animation: entryIn .25s ease;
}

@keyframes entryIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.number {
    width: 30px;
    height: 30px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    color: var(--primary);

    background: rgba(118,86,232,.10);

    font-size: 11px;

    font-weight: 800;
}

.name {
    min-width: 0;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 13px;

    font-weight: 600;
}

.amount {
    white-space: nowrap;

    font-size: 13px;

    font-weight: 800;
}

.delete-btn {
    width: 30px;
    height: 30px;

    border: 0;

    border-radius: 10px;

    background: rgba(231,77,103,.09);

    color: var(--danger);

    font-size: 17px;

    cursor: pointer;
}

/* =========================
   BOTTOM ACTIONS
========================= */

.actions {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.action {
    height: 53px;

    border: 0;

    border-radius: 17px;

    font-family: inherit;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;
}

.download {
    color: white;

    background:
        linear-gradient(
            135deg,
            #10a879,
            #2bc99a
        );

    box-shadow:
        0 12px 28px rgba(16,168,121,.22);
}

.clear {
    color: #d94359;

    background: rgba(255,255,255,.60);

    border: 1px solid rgba(255,255,255,.85);
}

.action:active {
    transform: scale(.97);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 420px) {

    .app {
        padding:
            9px
            9px
            30px;
    }

    .header {
        padding: 20px;

        border-radius: 26px;
    }

    .header h1 {
        font-size: 29px;
    }

    .form {
        border-radius: 24px;
    }

    .entry {
        grid-template-columns:
            30px
            minmax(0,1fr)
            auto
            30px;

        gap: 7px;

        padding:
            12px;
    }

    .amount {
        font-size: 12px;
    }
}

@media (max-width: 340px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .actions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <section class="header glass">

        <div class="badge">
            ✦ CONTRIBUTION
        </div>

        <h1>
            Contribution List
        </h1>

        <p>
            Keep your contribution records organized
            in one beautiful list.
        </p>

    </section>


    <!-- INPUT -->
    <section class="form glass">

        <div class="field">

            <input
                id="nameInput"
                type="text"
                maxlength="50"
                autocomplete="off"
                placeholder="Enter contributor name"
            >

        </div>


        <div class="field">

            <input
                id="amountInput"
                type="number"
                min="1"
                step="0.01"
                inputmode="decimal"
                placeholder="Enter amount ₹"
            >

        </div>


        <button
            class="add-btn"
            onclick="addContribution()"
        >
            + Add Contribution
        </button>

    </section>


    <!-- STATS -->
    <section class="stats">

        <div class="stat glass">

            <div class="stat-label">
                TOTAL PEOPLE
            </div>

            <div
                class="stat-value"
                id="peopleCount"
            >
                0
            </div>

        </div>


        <div class="stat glass">

            <div class="stat-label">
                TOTAL AMOUNT
            </div>

            <div
                class="stat-value"
                id="totalAmount"
            >
                ₹0.00
            </div>

        </div>

    </section>


    <!-- LIST -->
    <section class="list-card glass">

        <div class="list-header">

            <strong>
                Contributors
            </strong>

            <span
                class="count"
                id="entryCount"
            >
                0 / 20
            </span>

        </div>


        <div id="contributionList">

            <div class="empty">
                No contributions added yet.
            </div>

        </div>

    </section>


    <!-- ACTIONS -->
    <div class="actions">

        <button
            class="action download"
            onclick="downloadJPEG()"
        >
            ↓ Download JPEG
        </button>


        <button
            class="action clear"
            onclick="clearAll()"
        >
            Clear All
        </button>

    </div>

</div>


<!--
    html2canvas
    Used only to generate the JPEG.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<script>

/* ==========================================
   STORAGE KEY
========================================== */

const STORAGE_KEY =
    "contribution_list_data_v1";


/* ==========================================
   LOAD DATA
========================================== */

let entries = loadData();


function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return [];
        }

        const parsed =
            JSON.parse(saved);

        if (!Array.isArray(parsed)) {
            return [];
        }

        return parsed.slice(0, 20);

    } catch (error) {

        console.error(
            "Unable to load saved data:",
            error
        );

        return [];
    }
}


/* ==========================================
   SAVE DATA
========================================== */

function saveData() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(entries)
        );

    } catch (error) {

        console.error(
            "Unable to save data:",
            error
        );

        alert(
            "Your browser could not save the data."
        );
    }
}


/* ==========================================
   ADD CONTRIBUTION
========================================== */

function addContribution() {

    const nameInput =
        document.getElementById("nameInput");

    const amountInput =
        document.getElementById("amountInput");


    const name =
        nameInput.value.trim();

    const amount =
        Number(amountInput.value);


    if (!name) {

        alert(
            "Please enter the contributor name."
        );

        nameInput.focus();

        return;
    }


    if (!Number.isFinite(amount) || amount <= 0) {

        alert(
            "Please enter a valid amount."
        );

        amountInput.focus();

        return;
    }


    if (entries.length >= 20) {

        alert(
            "Maximum 20 contributors allowed."
        );

        return;
    }


    entries.push({

        id:
            Date.now() +
            Math.random()
            .toString(36)
            .substring(2),

        name:
            name,

        amount:
            Number(amount.toFixed(2)),

        createdAt:
            new Date().toISOString()

    });


    saveData();

    renderList();


    nameInput.value = "";

    amountInput.value = "";

    nameInput.focus();
}


/* ==========================================
   DELETE
========================================== */

function deleteContribution(index) {

    const person =
        entries[index];

    if (!person) {
        return;
    }


    if (
        confirm(
            `Remove "${person.name}" from the list?`
        )
    ) {

        entries.splice(index, 1);

        saveData();

        renderList();
    }
}


/* ==========================================
   CLEAR ALL
========================================== */

function clearAll() {

    if (entries.length === 0) {

        alert(
            "There are no contributions to clear."
        );

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete all contributions?"
        );


    if (!confirmed) {
        return;
    }


    entries = [];

    localStorage.removeItem(
        STORAGE_KEY
    );

    renderList();
}


/* ==========================================
   RENDER LIST
========================================== */

function renderList() {

    const list =
        document.getElementById(
            "contributionList"
        );


    list.innerHTML = "";


    let total = 0;


    entries.forEach(
        (entry, index) => {

            total += Number(entry.amount);


            const row =
                document.createElement("div");


            row.className =
                "entry";


            row.innerHTML = `

                <div class="number">
                    ${index + 1}
                </div>

                <div
                    class="name"
                    title="${escapeHTML(entry.name)}"
                >
                    ${escapeHTML(entry.name)}
                </div>

                <div class="amount">
                    ${formatMoney(entry.amount)}
                </div>

                <button
                    class="delete-btn"
                    aria-label="Delete contribution"
                    onclick="deleteContribution(${index})"
                >
                    ×
                </button>

            `;


            list.appendChild(row);
        }
    );


    if (entries.length === 0) {

        list.innerHTML = `

            <div class="empty">

                No contributions added yet.

            </div>

        `;
    }


    document.getElementById(
        "peopleCount"
    ).textContent =
        entries.length;


    document.getElementById(
        "entryCount"
    ).textContent =
        `${entries.length} / 20`;


    document.getElementById(
        "totalAmount"
    ).textContent =
        formatMoney(total);
}


/* ==========================================
   MONEY FORMAT
========================================== */

function formatMoney(amount) {

    return "₹" +
        Number(amount).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;
}


/* ==========================================
   ENTER KEY
========================================== */

document
    .getElementById("nameInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                document
                    .getElementById(
                        "amountInput"
                    )
                    .focus();
            }

        }
    );


document
    .getElementById("amountInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addContribution();
            }

        }
    );


/* ==========================================
   DOWNLOAD JPEG
========================================== */

async function downloadJPEG() {

    if (entries.length === 0) {

        alert(
            "Please add at least one contribution first."
        );

        return;
    }


    if (
        typeof html2canvas ===
        "undefined"
    ) {

        alert(
            "JPEG generator is not available. Please check your internet connection once."
        );

        return;
    }


    const total =
        entries.reduce(
            (sum, item) =>
                sum + Number(item.amount),
            0
        );


    /*
       Temporary export container.
       It is NOT visible on the website.
    */

    const exportBox =
        document.createElement("div");


    exportBox.style.position =
        "fixed";

    exportBox.style.left =
        "-99999px";

    exportBox.style.top =
        "0";

    exportBox.style.width =
        "800px";

    exportBox.style.padding =
        "45px";

    exportBox.style.fontFamily =
        "Arial, sans-serif";

    exportBox.style.background =
        "linear-gradient(135deg,#eeeaff,#eefcff,#fff0f7)";


    let rows = "";


    entries.forEach(
        (entry, index) => {

            rows += `

                <div style="
                    display:grid;
                    grid-template-columns:
                        55px 1fr 180px;

                    align-items:center;

                    gap:10px;

                    padding:
                        15px 18px;

                    margin-bottom:8px;

                    border-radius:17px;

                    background:
                        rgba(255,255,255,.72);

                    border:
                        1px solid
                        rgba(255,255,255,.95);
                ">

                    <div style="
                        width:34px;
                        height:34px;

                        display:flex;
                        align-items:center;
                        justify-content:center;

                        border-radius:11px;

                        background:#eee9ff;

                        color:#7656e8;

                        font-size:13px;

                        font-weight:800;
                    ">
                        ${index + 1}
  v
                class="stat-value"
                id="totalAmount"
            >
                ₹0.00
            </div>

        </div>

    </section>


    <!-- LIST -->
    <section class="list-card glass">

        <div class="list-header">

            <strong>
                Contributors
            </strong>

            <span
                class="count"
                id="entryCount"
            >
                0 / 20
            </span>

        </div>


        <div id="contributionList">

            <div class="empty">
                No contributions added yet.
            </div>

        </div>

    </section>


    <!-- ACTIONS -->
    <div class="actions">

        <button
            class="action download"
            onclick="downloadJPEG()"
        >
            ↓ Download JPEG
        </button>


        <button
            class="action clear"
            onclick="clearAll()"
        >
            Clear All
        </button>

    </div>

</div>

-->

        `${entries.length} / 20`;


    document.getElementById(
        "totalAmount"
    ).textContent =
        formatMoney(total);
}


/* ==========================================
   MONEY FORMAT
========================================== */

function formatMoney(amount) {

    return "₹" +
        Number(amount).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;
}


/* ==========================================
   ENTER KEY
========================================== */

document
    .getElementById("nameInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                document
                    .getElementById(
                        "amountInput"
                    )
                    .focus();
            }

        }
    );


document
    .getElementById("amountInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addContribution();
            }

        }
    );


/* ==========================================
   DOWNLOAD JPEG
========================================== */

async function downloadJPEG() {

    if (entries.length === 0) {

        alert(
            "Please add at least one contribution first."
        );

        return;
    }


    if (
        typeof html2canvas ===
        "undefined"
    ) {

        alert(

        );

        return;
    }


    const total =
        entries.reduce(
            (sum, item) =>
                sum + Number(item.amount),

        );


    /*

    */

    let rows = "";


    entries.forEach(
        (entry, index) => {

            rows += `

                    align-items:center;

                    gap:10px;

                        15px 18px;

                    border-radius:17px;

                ">

                    <div style="

                        display:flex;
                        align-items:center;
                        justify-content:center;

                        border-radius:11px;

                        background:#eee9ff;

                        font-size:13px;

                        font-weight:800;
                    ">

  <div class="empty">

        `;
    }

    document.getElementById("people").textContent =

}


/* Delete */
function removeEntry(index) {

    entries.splice(index, 1);

    render();
}


/* Clear */
function clearAll() {

    if (entries.length === 0) return;

    if (confirm("Clear all contributions?")) {

        entries = [];

        render();
    }
}


/* Enter key */
document.getElementById("amount").addEventListener(
    "keydown",
    function(e) {

        if (e.key === "Enter") {
            addEntry();
        }

    }
);


/* Security */
function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* JPEG Generator */
async function downloadJPEG() {

    if (entries.length === 0) {

        alert("Add at least one contribution first.");

        return;
    }

    let total = entries.reduce(
        (sum, item) => sum + item.amount,
        0
    );

    /*
       Create a separate premium export card.
       This keeps the downloaded JPEG clean.
    */

    const exportDiv = document.createElement("div");

    exportDiv.style.position = "fixed";
    exportDiv.style.left = "-99999px";
    exportDiv.style.top = "0";
    exportDiv.style.width = "800px";
    exportDiv.style.padding = "45px";
    exportDiv.style.fontFamily = "Arial, sans-serif";
    exportDiv.style.background =
        "linear-gradient(135deg,#eeeaff,#eefcff,#fff0f7)";

    let rows = "";

    entries.forEach((item, index) => {

        rows += `
        <div style="
            display:grid;
            grid-template-columns:60px 1fr 180px;
            align-items:center;
            padding:17px 20px;
            margin-bottom:8px;
            border-radius:16px;
            background:rgba(255,255,255,.72);
            border:1px solid rgba(255,255,255,.9);
        ">

            <div style="
                width:34px;
                height:34px;
                border-radius:11px;
                background:#eee9ff;
                color:#7656e8;
                display:flex;
                align-items:center;
                justify-content:center;
                font-weight:bold;
                font-size:13px;
            ">
                ${index + 1}
            </div>

            <div style="
                font-size:18px;
                font-weight:600;
                color:#20202b;
            ">
                ${escapeHTML(item.name)}
            </div>

            <div style="
                text-align:right;
                font-size:18px;
                font-weight:bold;
                color:#7656e8;
            ">
                ₹${item.amount.toLocaleString("en-IN", {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                })}
            </div>

        </div>`;
    });

    exportDiv.innerHTML = `

        <div style="
            border-radius:30px;
            padding:34px;
            background:rgba(255,255,255,.62);
            border:1px solid rgba(255,255,255,.9);
            box-shadow:0 20px 60px rgba(50,40,100,.15);
        ">

            <div style="
                font-size:13px;
                font-weight:bold;
                color:#7656e8;
                letter-spacing:2px;
                text-transform:uppercase;
            ">
                CONTRIBUTION RECORD
            </div>

            <div style="
                font-size:38px;
                font-weight:800;
                color:#171525;
                margin-top:10px;
            ">
                Contribution List
            </div>

            <div style="
                color:#77738a;
                font-size:15px;
                margin-top:7px;
                margin-bottom:28px;
            ">
                Contributor details and collected amount
            </div>

            ${rows}

            <div style="
                margin-top:20px;
                padding:22px;
                border-radius:20px;
                background:linear-gradient(135deg,#7656e8,#9c7cff);
                color:white;
                display:flex;
                justify-content:space-between;
                align-items:center;
            ">

                <div>
                    <div style="
                        font-size:13px;
                        opacity:.8;
                    ">
                        TOTAL CONTRIBUTION
                    </div>

                    <div style="
                        font-size:28px;
                        font-weight:800;
                        margin-top:4px;
                    ">
                        ₹${total.toLocaleString("en-IN", {
                            minimumFractionDigits:2,
                            maximumFractionDigits:2
                        })}
                    </div>
                </div>

                <div style="
                    font-size:14px;
                    text-align:right;
                ">
                    ${entries.length} Contributor${entries.length !== 1 ? "s" : ""}
                </div>

            </div>

            <div style="
                text-align:center;
                color:#9995a5;
                font-size:11px;
                margin-top:22px;
            ">
                Generate by Macmilan
            </div>

        </div>
    `;

    document.body.appendChild(exportDiv);

    try {

        const canvas = await html2canvas(exportDiv, {
            scale: 2,
            backgroundColor: null,
            useCORS: true
        });

        const link = document.createElement("a");

        const date = new Date()
            .toISOString()
            .split("T")[0];

        link.download =
            "Contribution-List-" + date + ".jpg";

        link.href =
            canvas.toDataURL("image/jpeg", 0.95);

        link.click();

    } catch (error) {

        console.error(error);

        alert("Unable to create JPEG.");

    }

    document.body.removeChild(exportDiv);
}


/* Initial */
render();

</script>
